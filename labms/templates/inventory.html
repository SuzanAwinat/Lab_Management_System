{% extends 'base.html' %}
{% block title %}Inventory - SciTech Labs{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h3 class="mb-0">Inventory</h3>
  <a href="#" class="btn btn-primary disabled" aria-disabled="true">Add Item</a>
</div>
<div class="card">
  <div class="card-body p-0">
    <table class="table mb-0 align-middle">
      <thead>
        <tr>
          <th scope="col">Item</th>
          <th scope="col">Quantity</th>
          <th scope="col">Lab</th>
        </tr>
      </thead>
      <tbody>
        {% for i in inventory %}
        <tr>
          <td>{{ i.item }}</td>
          <td>{{ i.quantity }}</td>
          <td>{{ i.lab }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-center text-muted">No items</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="card-footer text-muted">CRUD coming next</div>
 </div>
{% endblock %}
